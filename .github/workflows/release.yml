# 四平台打包 + 发布 Release。
# 触发：推送 v* 标签（如 v1.0.14），或手动 workflow_dispatch。
# 产物命名与 update.json 的 downloadUrl 对齐：
#   wisp-windows-x64-<版本>.zip / wisp-macos-<版本>.zip
#   wisp-linux-x64-<版本>.tar.gz / wisp-android-<版本>.apk
#
# TLS 证书说明：assets/certs 的私钥不入库（见 .gitignore）。
# 每个平台的构建任务在打包前现场生成各自的 10 年自签证书——
# 不同平台指纹不同是设计内行为，信任模型是"首次连接人工对指纹"。
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.47.8'

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
          - os: macos-latest
            target: macos
          - os: ubuntu-latest
            target: linux
          - os: ubuntu-latest
            target: android
    steps:
      - uses: actions/checkout@v4

      # Android 构建需要 JDK 17（AGP 要求）。
      - name: Set up JDK 17
        if: matrix.target == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # 版本号取自标签：v1.0.14 -> 1.0.14。
      - name: Resolve version
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      # Linux 桌面构建的编译链依赖。
      - name: Install Linux build deps
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev

      # 现场生成自签证书，让 TLS 开关在发布包里真正可用。
      - name: Generate self-signed certificate
        shell: bash
        run: bash tools/gen_cert.sh

      - name: Build (windows)
        if: matrix.target == 'windows'
        run: flutter build windows --release

      - name: Build (macos)
        if: matrix.target == 'macos'
        run: flutter build macos --release

      - name: Build (linux)
        if: matrix.target == 'linux'
        run: flutter build linux --release

      - name: Build (android)
        if: matrix.target == 'android'
        run: flutter build apk --release

      # ---------- 打包 ----------
      - name: Package (windows)
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "build/windows/x64/runner/Release/*" `
            -DestinationPath "wisp-windows-x64-${env:VERSION}.zip"

      - name: Package (macos)
        if: matrix.target == 'macos'
        shell: bash
        # -y 保留 app 内符号链接，解压后才是完整的 .app。
        run: |
          cd build/macos/Build/Products/Release
          zip -r -y "$GITHUB_WORKSPACE/wisp-macos-${VERSION}.zip" wisp.app

      - name: Package (linux)
        if: matrix.target == 'linux'
        shell: bash
        run: |
          tar -czf "wisp-linux-x64-${VERSION}.tar.gz" -C build/linux/x64/release .

      - name: Package (android)
        if: matrix.target == 'android'
        shell: bash
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk "wisp-android-${VERSION}.apk"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: wisp-${{ matrix.target }}
          path: |
            wisp-windows-*.zip
            wisp-macos-*.zip
            wisp-linux-*.tar.gz
            wisp-android-*.apk
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
          fail_on_unmatched_files: true
