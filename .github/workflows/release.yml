# 四平台打包 + 发布 Release。
# 触发：推送 v* 标签（如 v1.0.14），或手动 workflow_dispatch。
# 产物（版本号取自标签）：
#   Windows  wisp-windows-x64-<v>.zip（便携） + wisp-windows-x64-<v>-setup.exe（Inno Setup 安装包）
#   macOS    wisp-macos-<v>.zip（便携） + wisp-macos-<v>.dmg（拖入 Applications）
#   Linux    wisp-linux-x64-<v>.tar.gz（便携） + .deb / .rpm（fpm）+ .AppImage（linuxdeploy）
#   Android  wisp-android-<v>.apk
# update.json 的 downloadUrl 指向 Windows 安装包。
#
# TLS 证书说明：assets/certs 的私钥不入库（见 .gitignore）。
# 每个平台的构建任务在打包前现场生成各自的 10 年自签证书——
# 不同平台指纹不同是设计内行为，信任模型是"首次连接人工对指纹"。
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.47.8'

jobs:
  # 质量门：标签一推就先跑静态分析与测试，挂了根本不进构建。
  # 此前这里只有 build —— 等于「推 tag 就把没跑过一行测试的二进制发出去」。
  #
  # 用 ubuntu：测试是纯 Dart VM，不需要桌面工具链，起得比 windows 快；
  # golden 用 --exclude-tags 跳过（基准图在本机 Windows 上维护，
  # 跨平台光栅化不保证逐像素一致，放进来只会变成假失败）。
  # 证书要先现场生成：assets/certs 的私钥不入库，而 lan_tls_test 会真起
  # TLS 接收端，缺证书时 isSecure 断言必挂。
  quality:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get

      - name: Generate self-signed certificate
        run: bash tools/gen_cert.sh

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --exclude-tags golden

  build:
    name: Build ${{ matrix.target }}
    needs: quality
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
          - os: macos-latest
            target: macos
          - os: ubuntu-latest
            target: linux
          - os: ubuntu-latest
            target: android
    steps:
      - uses: actions/checkout@v4

      # Android 构建需要 JDK 17（AGP 要求）。
      - name: Set up JDK 17
        if: matrix.target == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # 版本号取自标签：v1.0.14 -> 1.0.14。
      - name: Resolve version
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      # Linux 桌面构建的编译链依赖 + 打包工具（ImageMagick 缩图标，fpm 产 deb/rpm）。
      - name: Install Linux build deps
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev imagemagick
          sudo gem install fpm --no-document

      # 现场生成自签证书，让 TLS 开关在发布包里真正可用。
      - name: Generate self-signed certificate
        shell: bash
        run: bash tools/gen_cert.sh

      - name: Build (windows)
        if: matrix.target == 'windows'
        run: flutter build windows --release

      - name: Build (macos)
        if: matrix.target == 'macos'
        run: flutter build macos --release

      - name: Build (linux)
        if: matrix.target == 'linux'
        run: flutter build linux --release

      - name: Prepare Android signing key
        if: matrix.target == 'android'
        shell: bash
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KS_KEY_PWD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KS_STORE_PWD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          # 把 GitHub Secret 里的 base64 密钥库还原成文件，并写出 key.properties。
          # 每次发版都用这同一把密钥签名，覆盖安装才不会再报"签名不一致"。
          echo "$KS_B64" | base64 -d > android/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$KS_STORE_PWD
          keyPassword=$KS_KEY_PWD
          keyAlias=$KS_ALIAS
          storeFile=upload-keystore.jks
          EOF
          ls -la android/upload-keystore.jks

      - name: Build (android)
        if: matrix.target == 'android'
        run: flutter build apk --release

      # ---------- 打包 ----------
      # 便携 zip + Inno Setup 安装包，双形态都给。
      - name: Package (windows)
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "build/windows/x64/runner/Release/*" `
            -DestinationPath "wisp-windows-x64-${env:VERSION}.zip"

      - name: Package (windows installer)
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=$env:VERSION /O. packaging\windows\wisp.iss

      # 便携 zip + DMG（拖入 Applications 的安装镜像）。
      - name: Package (macos)
        if: matrix.target == 'macos'
        shell: bash
        # -y 保留 app 内符号链接，解压后才是完整的 .app。
        run: |
          cd build/macos/Build/Products/Release
          zip -r -y "$GITHUB_WORKSPACE/wisp-macos-${VERSION}.zip" wisp.app

      - name: Package (macos dmg)
        if: matrix.target == 'macos'
        shell: bash
        run: |
          mkdir -p dmg-src
          cp -R build/macos/Build/Products/Release/wisp.app dmg-src/
          ln -s /Applications dmg-src/Applications
          hdiutil create -volname Wisp -srcfolder dmg-src -ov -format UDZO "wisp-macos-${VERSION}.dmg"

      # tar.gz 便携包 + deb/rpm（fpm）+ AppImage（linuxdeploy）。
      - name: Package (linux tarball)
        if: matrix.target == 'linux'
        shell: bash
        run: |
          tar -czf "wisp-linux-x64-${VERSION}.tar.gz" -C build/linux/x64/release/bundle .

      - name: Package (linux deb/rpm)
        if: matrix.target == 'linux'
        shell: bash
        run: |
          chmod +x packaging/linux/wisp-wrapper.sh
          convert assets/icon/wisp_icon_1024.png -resize 256x256 /tmp/wisp.png
          COMMON_ARGS=(
            -s dir -n wisp -v "$VERSION"
            --url https://github.com/yunyu697/wisp
            --description "Wisp - LAN file transfer, LocalSend compatible"
            --maintainer "YuMEHa <yunyu697@users.noreply.github.com>"
          )
          fpm "${COMMON_ARGS[@]}" -t deb -a amd64 \
            build/linux/x64/release/bundle/=/opt/wisp/ \
            packaging/linux/wisp-wrapper.sh=/usr/bin/wisp \
            packaging/linux/wisp.desktop=/usr/share/applications/wisp.desktop \
            /tmp/wisp.png=/usr/share/pixmaps/wisp.png
          fpm "${COMMON_ARGS[@]}" -t rpm -a x86_64 \
            build/linux/x64/release/bundle/=/opt/wisp/ \
            packaging/linux/wisp-wrapper.sh=/usr/bin/wisp \
            packaging/linux/wisp.desktop=/usr/share/applications/wisp.desktop \
            /tmp/wisp.png=/usr/share/pixmaps/wisp.png
          mv "wisp_${VERSION}_amd64.deb" "wisp-linux-x64-${VERSION}.deb"
          # fpm 的 rpm 文件名自带 release 号（wisp-1.0.14-1.x86_64.rpm），用通配收编。
          mv wisp-${VERSION}-*.x86_64.rpm "wisp-linux-x64-${VERSION}.rpm"

      - name: Package (linux AppImage)
        if: matrix.target == 'linux'
        shell: bash
        run: |
          convert assets/icon/wisp_icon_1024.png -resize 256x256 /tmp/wisp.png
          mkdir -p AppDir
          cp -r build/linux/x64/release/bundle/* AppDir/
          # 放 /tmp 避免干扰后面挑产物；无 FUSE 的 runner 要 extract-and-run。
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage -O /tmp/linuxdeploy.AppImage
          chmod +x /tmp/linuxdeploy.AppImage
          export APPIMAGE_EXTRACT_AND_RUN=1
          /tmp/linuxdeploy.AppImage \
            --appdir AppDir \
            --executable AppDir/wisp \
            --desktop-file packaging/linux/wisp.desktop \
            --icon-file /tmp/wisp.png \
            --output appimage
          mv *.AppImage "wisp-linux-x64-${VERSION}.AppImage"

      - name: Package (android)
        if: matrix.target == 'android'
        shell: bash
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk "wisp-android-${VERSION}.apk"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: wisp-${{ matrix.target }}
          path: |
            wisp-windows-*.zip
            wisp-windows-*-setup.exe
            wisp-macos-*.zip
            wisp-macos-*.dmg
            wisp-linux-*.tar.gz
            wisp-linux-*.deb
            wisp-linux-*.rpm
            wisp-linux-*.AppImage
            wisp-android-*.apk
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
          fail_on_unmatched_files: true
