name: wisp
description: "Wisp — 只在近处发生的文件传递。局域网点对点互传，不经过任何服务器。"
publish_to: "none"
version: 2.2.7+43

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  characters: ^1.4.1
  provider: ^6.1.2
  shared_preferences: ^2.3.3
  path_provider: ^2.1.5
  file_picker: 8.3.7
  crypto: ^3.0.6
  lpinyin: ^2.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/certs/
    - assets/icons/t1/ui/
    - assets/icons/t1/app/

flutter_launcher_icons:
  image_path: "assets/icon/wisp_icon_1024.png"
  android: true
  ios: true
  remove_alpha_ios: true
  # t1 图标：绿色 squircle + 白色消息卡 + 浅绿文件卡。自适应图标用深绿纯色底
  # 承接 squircle 的主色，前景只放两张卡（wisp_icon_adaptive_foreground.svg）。
  adaptive_icon_background: "#0FA85C"
  # 前景用预排版主图：图形已占画布 67%（安全区 66%）。
  # 之前直接用 wisp_icon_foreground.png（图形只有 39%）再叠默认 16% inset，
  # 图形最终只占两成多，被反馈"图形部分占图标的比例太小"。
  adaptive_icon_foreground: "assets/icon/wisp_icon_adaptive_foreground.png"
  adaptive_icon_foreground_inset: 0
  windows:
    generate: true
    image_path: "assets/icon/wisp_icon_1024.png"
  macos:
    generate: true
    image_path: "assets/icon/wisp_icon_1024.png"
  web:
    generate: true
    image_path: "assets/icon/wisp_icon_1024.png"

dependency_overrides:
  # path_provider_foundation / shared_preferences_foundation 的新版本
  # 都拖进 objective_c，其 native assets hook 在 Windows 路径含空格时
  # 直接崩（dart sdk bug），统一固定到仍用 ffi 的旧版绕开。
  path_provider_foundation: 2.4.1
  shared_preferences_foundation: 2.3.5
